[project]
name = "tea-advisor"
version = "0.1.0"
description = "中医食性的确定性判定层 + 本地饮食茶饮建议助手（终端与本地 Web 双壳）"
requires-python = ">=3.10"

# 核心依赖 = 数据层 / 判定层 / Agent 层所需。
# 只想把食性数据层当库用的人，装完这个就能 `from app.services.food_lookup import resolve_food`，
# 不需要 Web 框架。（注意：数据层经由 app.config 依赖 python-dotenv，见 CONTRIBUTING）
dependencies = [
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "deepseek-harness-sdk>=0.1.2rc1",
]

[project.optional-dependencies]
# 本地 Web 界面（ui/web/）所需。只用终端界面（ui/terminal/）时不必安装。
web = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.setuptools.packages.find]
# 正式支持从 core/ 执行 ``pip install .``。flat-layout 下 setuptools 会把同级
# data/ 误判为顶层命名空间包；只收录 app*，既修复构建歧义，也不把数据目录当代码发布。
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
