[project]
name = "tea-advisor"
version = "0.1.0"
description = "中医饮食茶饮推荐小程序 - 后端（demo）"
requires-python = ">=3.10"

dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.9",
    "python-dotenv>=1.0",
    "httpx>=0.27",
    "deepseek-harness-sdk>=0.1.2rc1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
